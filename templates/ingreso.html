{% extends "base.html" %}
{% block content %}
<h1 class="page-title h2 mb-4">Ingreso al evento</h1>
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card card-soft p-4">
      <div id="visor" class="rounded-3 overflow-hidden mb-2" style="display:none"></div>
      <div class="d-flex gap-2 flex-wrap mb-3">
        <button id="btn-cam" class="btn btn-azul"><i class="bi bi-camera-video me-1"></i>Activar cámara</button>
        <label class="btn btn-outline-primary mb-0"><i class="bi bi-image me-1"></i>Escanear imagen
          <input type="file" id="img-qr" accept="image/*" hidden></label>
      </div>
      <div id="qr-oculto" style="display:none"></div>
      <label class="form-label fw-semibold">O escribe el identificador del ticket</label>
      <input id="ticket" class="form-control scan-input" autocomplete="off" placeholder="SIM-0001" autofocus>
      <div id="resultado" class="mt-3"></div>
      <div class="row text-center mt-3">
        <div class="col"><div class="h2 mb-0 text-success" id="c-uso">{{ c.t_UTILIZADO }}</div><small class="text-muted">Ingresaron</small></div>
        <div class="col"><div class="h2 mb-0 text-primary" id="c-asig">{{ c.t_ASIGNADO }}</div><small class="text-muted">Por ingresar</small></div>
        <div class="col"><div class="h2 mb-0" id="c-disp">{{ c.t_DISPONIBLE }}</div><small class="text-muted">Sin asignar</small></div>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card card-soft p-3">
      <h5 class="fw-bold">Últimos ingresos</h5>
      <div class="table-responsive" style="max-height:520px;overflow:auto">
        <table class="table table-sm table-hover align-middle mb-0"><thead class="table-light"><tr><th>Hora</th><th>Ticket</th><th>Carnet</th><th>Nombre</th></tr></thead>
        <tbody id="lista"></tbody></table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=ok?880:220;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),ok?120:350);}catch(e){}}
async function cargar(){
  const r=await (await fetch('/api/ingresos')).json();
  $('lista').innerHTML=r.ingresos.map(i=>`<tr><td>${esc(i.fecha_uso.slice(11,19))}</td><td>${esc(i.ticket)}</td><td>${esc(i.carnet)}</td><td>${esc(i.nombre)}</td></tr>`).join('')||'<tr><td colspan=4 class="text-muted text-center">Sin ingresos todavía</td></tr>';
  $('c-uso').textContent=r.c.t_UTILIZADO;$('c-asig').textContent=r.c.t_ASIGNADO;$('c-disp').textContent=r.c.t_DISPONIBLE;
}
async function enviar(body){
  const res=await fetch('/api/ingreso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await res.json();
  const datos=d.nombre?`<div class="mt-2 small">Nombre: <b>${esc(d.nombre)}</b><br>Carnet: <b>${esc(d.carnet)}</b><br>Estado del pago: <b>${esc(d.estado_pago)}</b><br>Ticket: <b>${esc(d.ticket)}</b></div>`:'';
  $('resultado').innerHTML=`<div class="alert alert-${d.autorizado?'success':'danger'} mb-0"><div class="fw-bold fs-5"><i class="bi bi-${d.autorizado?'check-circle':'x-octagon'} me-2"></i>${d.autorizado?'INGRESO AUTORIZADO':'INGRESO RECHAZADO'}</div>${esc(d.mensaje)}${datos}</div>`;
  beep(d.autorizado);$('ticket').value='';cargar();
}
let scanner=null,ultimo='',ultimoT=0;
async function alLeer(texto){
  const ahora=Date.now();
  if(texto===ultimo&&ahora-ultimoT<4000)return;   // evita doble lectura del mismo QR
  ultimo=texto;ultimoT=ahora;await enviar({qr:texto});
}
$('btn-cam').addEventListener('click',async()=>{
  if(scanner){await scanner.stop();scanner.clear();scanner=null;$('visor').style.display='none';$('btn-cam').innerHTML='<i class="bi bi-camera-video me-1"></i>Activar cámara';return;}
  $('visor').style.display='block';
  scanner=new Html5Qrcode('visor');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},alLeer);
      $('btn-cam').innerHTML='<i class="bi bi-camera-video-off me-1"></i>Detener cámara';}
  catch(err){scanner=null;$('visor').style.display='none';
    $('resultado').innerHTML='<div class="alert alert-danger mb-0">No se pudo abrir la cámara (requiere permiso y HTTPS o localhost). '+esc(err)+'</div>';}
});
$('img-qr').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const s=new Html5Qrcode('qr-oculto');const t=await s.scanFile(f,false);s.clear();await alLeer(t);}
  catch(err){$('resultado').innerHTML='<div class="alert alert-danger mb-0">No se encontró un QR en la imagen.</div>';}
  e.target.value='';
});
$('ticket').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())enviar({ticket:e.target.value.trim()});});
cargar();
</script>
{% endblock %}
