{% extends 'base.html' %}

{% block title %}Validar Pago - Simposio 2026{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg p-4 rounded-4">
                <h4 class="fw-bold text-center mb-3"><i class="bi bi-receipt text-primary me-2"></i>Validación de Pago</h4>
                <p class="text-muted small text-center mb-4">Ingresa tus datos para cruzar el reporte de Tesorería con el listado oficial.</p>

                <form action="/datos" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número de Carné</label>
                        <input type="text" name="carne" class="form-control" placeholder="Ej. 20260123" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número de Recibo</label>
                        <input type="text" name="no_recibo" class="form-control" placeholder="Ej. REC-89452" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Nombre completo" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Verificar e Ingresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
